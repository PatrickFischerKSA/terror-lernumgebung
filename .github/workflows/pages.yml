name: Publish learning environment
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate learning environment
        run: |
          node --check dist/feedback.js
          node --check dist/reader.js
          node --check dist/app.js
          node --check dist/data.js
          node --check dist/visuals.js
          node tests/visuals.cjs
          node --check dist/aviation.js
          node tests/aviation.cjs
          node check.cjs
          node feedback-check.cjs
          node --check dist/spielraum/court.js
          node --check dist/spielraum/content.js
          node tests/content.mjs
          node --check dist/spielraum/assistant.js
          node --check dist/spielraum/argumentation.js
          node tests/assistant.mjs
          node --check dist/spielraum/library.js
          node tests/client-send.mjs
          node --check dist/spielraum/coach.js
          node tests/coach.mjs
          python3 tests/windows-package.py
          python3 tests/mac-package.py
          npx tsc --noEmit
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
